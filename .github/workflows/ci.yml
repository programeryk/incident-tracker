name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incident_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d incident_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/incident_tracker_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Generate backend Prisma client
        run: npm run prisma:generate

      - name: Typecheck backend
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Lint backend
        run: npm run lint

      - name: Check backend formatting
        run: npm run format:check

      - name: Backend unit tests
        run: npm test

      - name: Backend E2E tests
        run: npm run test:e2e

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Seed browser test data
        run: npm run prisma:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Frontend browser tests
        run: npm run test:browser
        env:
          PORT: 3000

      - name: Build backend Docker image
        run: docker build -t incident-tracker-api:test .

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:3000 -t incident-tracker-web:test .
